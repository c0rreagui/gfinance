<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        body { 
            margin: 0; 
            background: transparent; 
            font-family: var(--font-body); 
            color: white;
            overflow: hidden;
        }
        .widget-lock {
            width: 280px;
            height: 64px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="widget-lock">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500/20 rounded-xl flex items-center justify-center border border-emerald-500/30">
                <div class="w-6 h-6 bg-emerald-500 rounded-lg flex items-center justify-center text-white text-[10px] font-black">G</div>
            </div>
            <div>
                <div class="text-[10px] font-bold text-white/50 uppercase tracking-widest">Saldo Atual</div>
                <div class="text-lg font-black tracking-tight">R$ 12.450,80</div>
            </div>
        </div>
        <div class="flex flex-col items-end">
            <div class="text-[9px] font-bold text-emerald-400 flex items-center gap-1 uppercase tracking-widest">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full pulse"></span> Ao vivo
            </div>
            <div class="text-[10px] text-white/30 font-medium">Itaú • Platinum</div>
        </div>
    </div>
</body>
</html>
