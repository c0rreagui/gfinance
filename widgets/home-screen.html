<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: oklch(98% 0.004 240);
            --surface: oklch(100% 0 0);
            --fg: oklch(20% 0.02 240);
            --accent: oklch(56% 0.12 170);
            --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        body { 
            margin: 0; 
            background: transparent; 
            font-family: var(--font-body); 
            color: var(--fg);
            overflow: hidden;
        }
        .widget-home {
            width: 148px;
            height: 148px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        .bar {
            transition: height 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes grow { from { height: 0; } }
        .bar { animation: grow 1s ease-out backwards; }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="widget-home">
        <div class="flex justify-between items-start">
            <div class="w-6 h-6 bg-[#10B981] rounded-lg flex items-center justify-center text-white text-xs font-black shadow-lg shadow-emerald-500/20">G</div>
            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest text-right leading-tight">Gastos<br>Semanal</span>
        </div>
        
        <div>
            <div class="text-[10px] font-bold text-slate-400 mb-0.5">Total</div>
            <div class="text-lg font-black tracking-tighter text-slate-900 dark:text-white leading-none">R$ 880,00</div>
        </div>

        <div class="flex items-end gap-1.5 h-10">
            {[30, 60, 45, 90, 50, 40, 70].map((h, i) => (
                <div 
                    key={i}
                    class={`flex-1 rounded-full bar ${h === 90 ? 'bg-emerald-500' : 'bg-slate-200/50'}`} 
                    style={`height: ${h}%; animation-delay: ${i * 0.1}s`}
                ></div>
            ))}
        </div>
    </div>
</body>
</html>
