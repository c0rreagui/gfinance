
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Finance | Dashboard</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: oklch(98% 0.004 240);
            --surface: oklch(100% 0 0);
            --fg: oklch(20% 0.02 240);
            --muted: oklch(50% 0.018 240);
            --border: oklch(90% 0.006 240);
            --accent: oklch(56% 0.12 170);
            --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body { background-color: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background-color 0.5s, color 0.5s; }
        .dark body { background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.05); }
        .chart-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2s ease-out forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="overflow-hidden h-screen flex">
    <div id="root" class="flex-1 flex overflow-hidden"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const MOCK_DATA = {
            stats: [
                { id: 1, label: 'Saldo Atual', value: 'R$ 12.450,80', trend: '+2.4%', icon: 'Wallet' },
                { id: 2, label: 'Receitas (Maio)', value: 'R$ 8.200,00', trend: '+12%', icon: 'ArrowUpCircle' },
                { id: 3, label: 'Despesas (Maio)', value: 'R$ 3.840,20', trend: '-5%', icon: 'ArrowDownCircle' },
            ],
            transactions: [
                { id: 1, date: '2024-05-24', desc: 'Assinatura Netflix', cat: 'Lazer', value: -55.90 },
                { id: 2, date: '2024-05-23', desc: 'Supermercado Silva', cat: 'Alimentação', value: -342.10 },
                { id: 3, date: '2024-05-22', desc: 'Transferência Salarial', cat: 'Salário', value: 5500.00 },
                { id: 4, date: '2024-05-21', desc: 'Posto Shell', cat: 'Transporte', value: -150.00 },
                { id: 5, date: '2024-05-20', desc: 'Restaurante Sabor', cat: 'Alimentação', value: -89.50 },
            ],
            chartData: [4500, 5200, 4800, 6100, 5800, 8200]
        };

        const Icon = ({ name, className, size = 20 }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase()} className={className} style={{ width: size, height: size }}></i>;
        };

        const Sidebar = () => (
            <aside className="w-64 glass border-r border-slate-200 dark:border-slate-700/50/50 flex flex-col h-full z-10">
                <div class="p-8">
                    <div className="flex items-center gap-3 mb-10">
                        <div className="w-8 h-8 bg-[#34D399] rounded-xl flex items-center justify-center text-white text-xl font-black">G</div>
                        <span className="font-black text-xl tracking-tight">G-Finance</span>
                    </div>
                    <nav className="space-y-1">
                        {[
                            { name: 'Visão Geral', icon: 'LayoutGrid', active: true, path: 'index.html' },
                            { name: 'Transações', icon: 'Receipt', path: 'screens/transactions.html' },
                            { name: 'Integrações', icon: 'Link', path: 'screens/integrations.html' },
                            { name: 'Configurações', icon: 'Settings', path: 'screens/settings.html' },
                        ].map((item) => (
                            <a key={item.name} href={item.path} className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 group ${item.active ? 'bg-emerald-50 text-emerald-700 font-bold' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name={item.icon} className={item.active ? 'text-emerald-600' : ''} size={18} />
                                <span className="text-sm">{item.name}</span>
                            </a>
                        ))}
                    </nav>
                </div>
            </aside>
        );

        const Header = ({ title }) => {
            const [isDark, setIsDark] = useState(false);
            useEffect(() => {
                if (document.documentElement.classList.contains('dark')) setIsDark(true);
            }, []);
            const toggleTheme = () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark'); setIsDark(false); localStorage.setItem('theme', 'light');
                } else {
                    html.classList.add('dark'); setIsDark(true); localStorage.setItem('theme', 'dark');
                }
            };
            return (
                <header className="h-20 border-b border-slate-200 dark:border-white/5 px-8 flex items-center justify-between glass sticky top-0 z-10 transition-colors">
                    <div className="flex items-center gap-4">
                        <h2 className="text-xl font-black tracking-tight dark:text-white" style={{ fontFamily: 'var(--font-display)' }}>{title}</h2>
                    </div>
                    <div className="flex items-center gap-6">
                        <button onClick={toggleTheme} className="p-2 text-slate-400 hover:text-emerald-500 transition-colors">
                            <Icon name={isDark ? 'Sun' : 'Moon'} size={20} />
                        </button>
                        <div className="flex items-center gap-3 pl-6 border-l border-slate-200 dark:border-white/5">
                            <div className="text-right hidden sm:block">
                                <p className="text-sm font-bold dark:text-white">Guilherme R.</p>
                                <p className="text-[10px] text-emerald-500 font-bold uppercase tracking-wider">Conta Platinum</p>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 border-2 border-emerald-100 dark:border-white/10 flex items-center justify-center text-slate-400">
                                <Icon name="User" size={20} />
                            </div>
                        </div>
                    </div>
                </header>
            );
        };

        const Dashboard = () => (
            <div className="flex-1 flex flex-col overflow-hidden">
                <Header title="Visão Geral" />
                <main className="flex-1 overflow-y-auto p-8 no-scrollbar bg-[#FAFAFC] dark:bg-transparent">
                    <div className="max-w-6xl mx-auto">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            {MOCK_DATA.stats.map((stat, i) => (
                                <div key={stat.id} className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-6 rounded-[28px] border border-white/50 dark:border-white/5 shadow-sm animate-in" style={{ animationDelay: `${i*0.1}s` }}>
                                    <div className="flex justify-between mb-4"><Icon name={stat.icon} className="text-emerald-500" /> <span className="text-xs font-bold text-emerald-600">{stat.trend}</span></div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">{stat.label}</p>
                                    <h3 className="text-2xl font-black dark:text-white">{stat.value}</h3>
                                </div>
                            ))}
                        </div>
                        <div className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-8 rounded-[32px] border border-white/50 dark:border-white/5 shadow-sm mb-8 animate-in" style={{ animationDelay: '0.4s' }}>
                            <h4 className="font-black text-lg mb-8 dark:text-white">Fluxo de Caixa</h4>
                            <div className="h-[200px] w-full relative">
                                <svg className="w-full h-full" viewBox="0 0 600 200" preserveAspectRatio="none">
                                    <path d="M 0 150 L 120 120 L 240 140 L 360 80 L 480 100 L 600 20" fill="none" stroke="#10B981" strokeWidth="4" className="chart-path" />
                                </svg>
                            </div>
                        </div>
                        <div className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-md rounded-[32px] border border-white/50 dark:border-white/5 shadow-sm overflow-hidden animate-in" style={{ animationDelay: '0.6s' }}>
                            <div className="p-8 border-b border-white/30 dark:border-white/5 flex justify-between items-center"><h4 className="font-black dark:text-white">Transações Recentes</h4><button className="text-emerald-600 text-sm font-bold">Ver tudo</button></div>
                            <table className="w-full text-left">
                                <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                    {MOCK_DATA.transactions.map(tx => (
                                        <tr key={tx.id} className="hover:bg-white/40 dark:hover:bg-white/5 transition-colors"><td className="px-8 py-5 text-sm font-bold dark:text-white">{tx.desc}</td><td className="px-8 py-5 text-sm text-slate-400">{tx.cat}</td><td className={`px-8 py-5 text-right font-black ${tx.value > 0 ? 'text-emerald-600' : 'dark:text-white'}`}>{tx.value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td></tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </main>
            </div>
        );

        const App = () => {
            useEffect(() => {
                const theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                }
            }, []);
            return (<div className="flex w-full h-full transition-colors duration-500"><Sidebar /><Dashboard /></div>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
