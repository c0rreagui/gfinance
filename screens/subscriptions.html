<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Finance | Assinaturas</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: oklch(98% 0.004 240);
            --surface: oklch(100% 0 0);
            --fg: oklch(20% 0.02 240);
            --muted: oklch(50% 0.018 240);
            --border: oklch(90% 0.006 240);
            --accent: oklch(56% 0.12 170); /* Emerald */
            --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body { background-color: var(--bg); transition: background-color 0.3s, color 0.3s; }
        .dark body { background-color: #020617; color: #f8fafc; } color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.3); }
        .mesh-gradient { transition: all 0.5s; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background-color: #f8fafc; background-image: radial-gradient(at 0% 0%, hsla(160, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(220, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(260, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 50% 50%, hsla(180, 100%, 98%, 1) 0, transparent 50%), radial-gradient(at 0% 100%, hsla(200, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(150, 100%, 95%, 1) 0, transparent 50%); filter: blur(100px); animation: meshMove 20s ease infinite alternate; }
        .dark .mesh-gradient { background-color: #020617; background-image: radial-gradient(at 0% 0%, hsla(160, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(220, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(260, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 50% 50%, hsla(180, 100%, 10%, 1) 0, transparent 50%), radial-gradient(at 0% 100%, hsla(200, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(150, 100%, 15%, 1) 0, transparent 50%); }
        @keyframes meshMove { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.1) translate(-2%, -2%); } }
        .animate-in { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tilt-card { transform-style: preserve-3d; perspective: 1000px; transition: transform 0.1s ease-out; }
        .tilt-card-inner { transform: translateZ(20px); }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="h-screen flex">
    <div class="mesh-gradient"></div>
    <div id="root" class="flex-1 flex overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const useTilt = () => {
            const ref = useRef(null);
            const [style, setStyle] = useState({});
            const onMouseMove = (e) => {
                if (!ref.current) return;
                const { left, top, width, height } = ref.current.getBoundingClientRect();
                const x = (e.clientX - left) / width;
                const y = (e.clientY - top) / height;
                const rotateX = (y - 0.5) * -15;
                const rotateY = (x - 0.5) * 15;
                setStyle({ transform: `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)` });
            };
            const onMouseLeave = () => setStyle({ transform: 'perspective(1000px) rotateX(0deg) rotateY(0deg)' });
            return { ref, style, onMouseMove, onMouseLeave };
        };

        const Icon = ({ name, className, size = 20 }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase()} className={className} style={{ width: size, height: size }}></i>;
        };

        const Sidebar = ({ activePage }) => (
            <aside className="w-64 glass border-r border-slate-200 dark:border-slate-700/50/50 flex flex-col h-full z-10 overflow-y-auto no-scrollbar">
                <div class="p-8">
                    <div className="flex items-center gap-3 mb-12">
                        <div className="w-10 h-10 bg-[#10B981] rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-emerald-500/20">G</div>
                        <span className="font-black text-xl tracking-tight">G-Finance</span>
                    </div>
                    
                    <nav className="space-y-1">
                        {[
                            { name: 'Visão Geral', icon: 'LayoutGrid', path: '../index.html' },
                            { name: 'Transações', icon: 'Receipt', path: 'transactions.html' },
                            { name: 'Cartões', icon: 'CreditCard', path: 'cards.html' },
                            { name: 'Dívidas', icon: 'Landmark', path: 'debts.html' },
                            { name: 'Metas & Invest.', icon: 'Target', path: 'wealth.html' },
                            { name: 'Assinaturas', icon: 'Repeat', active: activePage === 'subscriptions', path: 'subscriptions.html' },
                            { name: 'Relatórios', icon: 'BarChart3', path: 'analytics.html' },
                            { name: 'Cripto', icon: 'Coins', path: 'crypto.html' },
                            { name: 'Integrações', icon: 'Link', path: 'integrations.html' },
                            { name: 'Configurações', icon: 'Settings', path: 'settings.html' },
                        ].map((item) => (
                            <a 
                                key={item.name}
                                href={item.path}
                                className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 group ${
                                    item.active ? 'bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-500/20' : 'text-slate-500 hover:bg-white/50 hover:text-slate-900'
                                }`}
                            >
                                <Icon name={item.icon} className={item.active ? 'text-white' : 'group-hover:text-emerald-600'} size={18} />
                                <span className="text-sm">{item.name}</span>
                            </a>
                        ))}
                    </nav>
                </div>
            </aside>
        );

        const Header = ({ title }) => (
            <header className="h-20 border-b border-slate-200 dark:border-slate-700/50/50 px-8 flex items-center justify-between glass sticky top-0 z-10">
                <h2 className="text-2xl font-black tracking-tighter" style={{ fontFamily: 'var(--font-display)' }}>{title}</h2>
                <div className="flex items-center gap-3">
                    <div className="text-right hidden sm:block">
                        <p className="text-sm font-bold leading-tight">Guilherme</p>
                        <p className="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">Conta Platinum</p>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 border-2 border-emerald-100 shadow-sm flex items-center justify-center text-slate-400">
                        <Icon name="User" size={20} />
                    </div>
                </div>
            </header>
        );

        const SubscriptionsPage = () => {
            const subs = [
                { id: 1, name: 'Netflix', price: 55.90, cycle: 'Mensal', next: '2024-06-15', status: 'Ativo', icon: 'Tv', color: 'red' },
                { id: 2, name: 'Adobe Creative Cloud', price: 124.00, cycle: 'Mensal', next: '2024-06-02', status: 'Ativo', icon: 'Edit3', color: 'purple' },
                { id: 3, name: 'Spotify Premium', price: 21.90, cycle: 'Mensal', next: '2024-06-10', status: 'Ativo', icon: 'Music', color: 'emerald' },
                { id: 4, name: 'iCloud+ 2TB', price: 34.90, cycle: 'Mensal', next: '2024-06-20', status: 'Ativo', icon: 'Cloud', color: 'blue' },
                { id: 5, name: 'Amazon Prime', price: 119.00, cycle: 'Anual', next: '2024-11-28', status: 'Ativo', icon: 'ShoppingBag', color: 'amber' },
            ];

            return (
                <div className="flex-1 flex flex-col overflow-hidden relative">
                    <Header title="Hub de Assinaturas" />
                    <main className="flex-1 overflow-y-auto p-8 no-scrollbar relative z-0">
                        <div className="max-w-6xl mx-auto space-y-8">
                            {/* Summary Card */}
                            <div className="bg-slate-900 rounded-[40px] p-8 text-white shadow-2xl flex flex-col md:flex-row justify-between items-center animate-in">
                                <div>
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Gasto Mensal Estimado</h3>
                                    <div className="text-4xl font-black text-emerald-400">R$ 356,70</div>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-2 font-bold uppercase tracking-widest">Baseado em 5 assinaturas ativas</p>
                                </div>
                                <div className="mt-6 md:mt-0 flex gap-4">
                                    <div className="bg-white/5 p-4 rounded-3xl border border-white/10 text-center">
                                        <p className="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase mb-1">Próximo Vencimento</p>
                                        <p className="text-sm font-bold">02 de Junho</p>
                                    </div>
                                    <div className="bg-emerald-500/10 p-4 rounded-3xl border border-emerald-500/20 text-center text-emerald-400">
                                        <p className="text-[10px] font-black text-emerald-400/50 uppercase mb-1">Economia Possível</p>
                                        <p className="text-sm font-bold">R$ 42,00</p>
                                    </div>
                                </div>
                            </div>

                            {/* Alert Card */}
                            <div className="bg-amber-50 border border-amber-200 p-6 rounded-[32px] flex items-center gap-6 animate-in" style={{ animationDelay: '0.2s' }}>
                                <div className="w-12 h-12 bg-amber-200 rounded-2xl flex items-center justify-center text-amber-700">
                                    <Icon name="AlertTriangle" />
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-bold text-amber-900">Aumento detectado</h4>
                                    <p className="text-sm text-amber-800 opacity-80">A assinatura da 'Netflix' subiu de R$ 45,90 para R$ 55,90 este mês.</p>
                                </div>
                                <button className="px-6 py-3 bg-amber-900 text-white text-xs font-black rounded-xl uppercase tracking-widest">Revisar</button>
                            </div>

                            {/* Grid of Subscriptions */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {subs.map((sub, i) => (
                                    <div key={sub.id} className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-8 rounded-[40px] border border-white/50 shadow-sm animate-in" style={{ animationDelay: `${0.3 + i*0.1}s` }}>
                                        <div className="flex justify-between items-start mb-6">
                                            <div className={`w-14 h-14 bg-${sub.color}-50 text-${sub.color}-600 rounded-2xl flex items-center justify-center border border-${sub.color}-100`}>
                                                <Icon name={sub.icon} size={28} />
                                            </div>
                                            <div className="text-right">
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Valor</p>
                                                <p className="text-xl font-black text-slate-900 dark:text-white">R$ {sub.price.toFixed(2)}</p>
                                            </div>
                                        </div>
                                        <h4 className="text-lg font-black text-slate-900 dark:text-white mb-1">{sub.name}</h4>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">{sub.cycle}</p>
                                        <div className="pt-6 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
                                            <div>
                                                <p className="text-[10px] font-black text-slate-400 uppercase mb-1">Renovação</p>
                                                <p className="text-xs font-bold text-slate-700">{new Date(sub.next).toLocaleDateString('pt-BR')}</p>
                                            </div>
                                            <button className="p-2 text-slate-400 hover:text-red-500 transition-colors">
                                                <Icon name="Trash2" size={18} />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                <button className="border-2 border-dashed border-slate-200 dark:border-slate-700/50 rounded-[40px] p-8 flex flex-col items-center justify-center gap-4 text-slate-400 hover:text-emerald-500 hover:border-emerald-500 transition-all group animate-in" style={{ animationDelay: '0.8s' }}>
                                    <div className="w-12 h-12 rounded-full border-2 border-slate-200 dark:border-slate-700/50 flex items-center justify-center group-hover:border-emerald-500 transition-colors">
                                        <Icon name="Plus" />
                                    </div>
                                    <span className="font-black uppercase tracking-widest text-xs">Nova Assinatura</span>
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const App = () => {
            useEffect(() => {
                try {
                    const theme = localStorage.getItem('theme');
                    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        document.documentElement.classList.add('dark');
                    }
                } catch (e) {}
            }, []);
        return (
            <div className="flex w-full h-full">
                <Sidebar activePage="subscriptions" />
                <SubscriptionsPage />
            </div>
        );

        try { const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); } catch (e) { console.error(e); }
    </script>
</body>
</html>
