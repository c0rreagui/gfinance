<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Finance | Cripto & Web3</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: oklch(98% 0.004 240);
            --surface: oklch(100% 0 0);
            --fg: oklch(20% 0.02 240);
            --muted: oklch(50% 0.018 240);
            --border: oklch(90% 0.006 240);
            --accent: oklch(56% 0.12 170); /* Emerald */
            --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body { background-color: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background-color 0.5s, color 0.5s; }
        .dark body { background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(15, 23, 42, 0.6); border-color: rgba(255, 255, 255, 0.05); }
        .mesh-gradient { transition: all 0.5s; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background-color: #f8fafc; background-image: radial-gradient(at 0% 0%, hsla(160, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(220, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(260, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 50% 50%, hsla(180, 100%, 98%, 1) 0, transparent 50%), radial-gradient(at 0% 100%, hsla(200, 100%, 95%, 1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(150, 100%, 95%, 1) 0, transparent 50%); filter: blur(100px); animation: meshMove 20s ease infinite alternate; }
        .dark .mesh-gradient { background-color: #020617; background-image: radial-gradient(at 0% 0%, hsla(160, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(220, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(260, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 50% 50%, hsla(180, 100%, 10%, 1) 0, transparent 50%), radial-gradient(at 0% 100%, hsla(200, 100%, 15%, 1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(150, 100%, 15%, 1) 0, transparent 50%); }
        @keyframes meshMove { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.1) translate(-2%, -2%); } }
        .animate-in { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glow { filter: drop-shadow(0 0 10px currentColor); }
    </style>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="h-screen flex">
    <div class="mesh-gradient"></div>
    <div id="root" class="flex-1 flex overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className, size = 20 }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase()} className={className} style={{ width: size, height: size }}></i>;
        };

        const Sidebar = ({ activePage }) => (
            <aside className="w-64 glass border-r border-slate-200 dark:border-slate-700/50/50 flex flex-col h-full z-10 overflow-y-auto no-scrollbar">
                <div class="p-8">
                    <div className="flex items-center gap-3 mb-12">
                        <div className="w-10 h-10 bg-[#10B981] rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-emerald-500/20">G</div>
                        <span className="font-black text-xl tracking-tight">G-Finance</span>
                    </div>
                    
                    <nav className="space-y-1">
                        {[
                            { name: 'Visão Geral', icon: 'LayoutGrid', path: '../index.html' },
                            { name: 'Transações', icon: 'Receipt', path: 'transactions.html' },
                            { name: 'Cartões', icon: 'CreditCard', path: 'cards.html' },
                            { name: 'Dívidas', icon: 'Landmark', path: 'debts.html' },
                            { name: 'Metas & Invest.', icon: 'Target', path: 'wealth.html' },
                            { name: 'Assinaturas', icon: 'Repeat', path: 'subscriptions.html' },
                            { name: 'Relatórios', icon: 'BarChart3', path: 'analytics.html' },
                            { name: 'Cripto', icon: 'Coins', active: activePage === 'crypto', path: 'crypto.html' },
                            { name: 'Integrações', icon: 'Link', path: 'integrations.html' },
                            { name: 'Configurações', icon: 'Settings', path: 'settings.html' },
                        ].map((item) => (
                            <a 
                                key={item.name}
                                href={item.path}
                                className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 group ${
                                    item.active ? 'bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-500/20' : 'text-slate-500 hover:bg-white/50 hover:text-slate-900'
                                }`}
                            >
                                <Icon name={item.icon} className={item.active ? 'text-white' : 'group-hover:text-emerald-600'} size={18} />
                                <span className="text-sm">{item.name}</span>
                            </a>
                        ))}
                    </nav>
                </div>
            </aside>
        );

        const Header = ({ title }) => {
            const [isDark, setIsDark] = useState(false);
            useEffect(() => {
                if (document.documentElement.classList.contains('dark')) setIsDark(true);
            }, []);
            const toggleTheme = () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark'); setIsDark(false); localStorage.setItem('theme', 'light');
                } else {
                    html.classList.add('dark'); setIsDark(true); localStorage.setItem('theme', 'dark');
                }
            };
            return (
                <header className="h-20 border-b border-slate-200 dark:border-white/5 px-8 flex items-center justify-between glass sticky top-0 z-10 transition-colors">
                    <div className="flex items-center gap-4">
                        <h2 className="text-xl font-black tracking-tight dark:text-white" style={{ fontFamily: 'var(--font-display)' }}>{title}</h2>
                    </div>
                    <div className="flex items-center gap-6">
                        <button onClick={toggleTheme} className="p-2 text-slate-400 hover:text-emerald-500 transition-colors">
                            <Icon name={isDark ? 'Sun' : 'Moon'} size={20} />
                        </button>
                        <div className="flex items-center gap-3">
                            <button className="px-6 py-2.5 bg-slate-900 dark:bg-slate-700 text-white text-xs font-black rounded-xl shadow-xl hover:scale-105 transition-transform uppercase tracking-widest flex items-center gap-2">
                                <Icon name="Wallet" size={16} /> Conectar Wallet
                            </button>
                            <div className="w-px h-8 bg-slate-200 dark:bg-white/10 mx-2"></div>
                            <div className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 border-2 border-emerald-100 dark:border-white/10 shadow-sm flex items-center justify-center text-slate-400">
                                <Icon name="User" size={20} />
                            </div>
                        </div>
                    </div>
                </header>
            );
        };

        const CryptoPage = () => {
            const coins = [
                { id: 1, name: 'Bitcoin', symbol: 'BTC', balance: '0.245', value: 'R$ 78.450', change: '+2.4%', color: 'amber' },
                { id: 2, name: 'Ethereum', symbol: 'ETH', balance: '3.12', value: 'R$ 54.200', change: '-1.8%', color: 'blue' },
                { id: 3, name: 'Solana', symbol: 'SOL', balance: '45.8', value: 'R$ 38.900', change: '+12.5%', color: 'purple' },
            ];

            return (
                <div className="flex-1 flex flex-col overflow-hidden relative">
                    <Header title="Cripto & Web3" />
                    <main className="flex-1 overflow-y-auto p-8 no-scrollbar relative z-0">
                        <div className="max-w-6xl mx-auto space-y-8">
                            {/* Portfolio Summary */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="lg:col-span-2 bg-slate-900 rounded-[40px] p-10 text-white shadow-2xl relative overflow-hidden animate-in">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-emerald-500/20 blur-[100px]"></div>
                                    <div className="relative z-10">
                                        <p className="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-[0.3em] mb-2">Patrimônio Cripto</p>
                                        <h3 className="text-5xl font-black mb-8 tracking-tighter">R$ 171.550,00</h3>
                                        <div className="flex gap-4">
                                            <span className="px-4 py-2 bg-emerald-500/20 text-emerald-400 text-xs font-black rounded-xl border border-emerald-500/30">+ R$ 4.200 (24h)</span>
                                            <span className="px-4 py-2 bg-white/5 text-slate-400 text-xs font-black rounded-xl border border-white/10">0.452 BTC EQV.</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-8 rounded-[40px] border border-white/50 dark:border-white/5 shadow-sm flex flex-col justify-center animate-in" style={{ animationDelay: '0.2s' }}>
                                    <h4 className="font-black text-slate-400 dark:text-slate-500 uppercase text-[10px] tracking-widest mb-6">Status da Rede</h4>
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-bold dark:text-slate-300">Ethereum Gas</span>
                                            <span className="text-sm font-black text-emerald-600 dark:text-emerald-400">12 Gwei</span>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-bold dark:text-slate-300">Bitcoin Hashrate</span>
                                            <span className="text-sm font-black dark:text-white">Stable</span>
                                        </div>
                                        <div className="h-px bg-slate-100 dark:bg-white/5 my-2"></div>
                                        <div className="flex items-center gap-2 text-emerald-600 dark:text-emerald-400">
                                            <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                            <span className="text-[10px] font-black uppercase tracking-widest">Mainnet Online</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Assets Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {coins.map((coin, i) => (
                                    <div key={coin.id} className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-8 rounded-[40px] border border-white/50 dark:border-white/5 shadow-sm animate-in" style={{ animationDelay: `${0.3 + i*0.1}s` }}>
                                        <div className="flex justify-between items-start mb-8">
                                            <div className={`w-12 h-12 bg-${coin.color}-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-${coin.color}-500/20 glow`}>
                                                <Icon name="Coins" />
                                            </div>
                                            <span className={`text-xs font-black px-2 py-1 rounded-lg ${coin.change.startsWith('+') ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-400' : 'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-400'}`}>
                                                {coin.change}
                                            </span>
                                        </div>
                                        <h4 className="font-black text-slate-900 dark:text-white text-xl">{coin.name}</h4>
                                        <p className="text-xs font-bold text-slate-400 uppercase mb-6 tracking-widest">{coin.symbol}</p>
                                        <div className="pt-6 border-t border-slate-100 dark:border-white/5 flex justify-between items-end">
                                            <div>
                                                <p className="text-[10px] font-black text-slate-400 uppercase mb-1">Saldo</p>
                                                <p className="text-sm font-black dark:text-slate-300">{coin.balance} {coin.symbol}</p>
                                            </div>
                                            <p className="text-sm font-black text-slate-900 dark:text-white">{coin.value}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* NFTs & Collectibles */}
                            <div className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-10 rounded-[48px] border border-white/50 dark:border-white/5 shadow-sm animate-in" style={{ animationDelay: '0.6s' }}>
                                <div className="flex justify-between items-center mb-10">
                                    <div>
                                        <h4 className="font-black text-2xl dark:text-white">NFTs & Ativos Digitais</h4>
                                        <p className="text-sm text-slate-500 dark:text-slate-400">Colecionáveis e tokens não fungíveis da sua carteira.</p>
                                    </div>
                                    <button className="text-emerald-600 dark:text-emerald-400 text-sm font-black uppercase tracking-widest">Explorar Market</button>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                    {[1,2,3,4].map(id => (
                                        <div key={id} className="aspect-square bg-slate-100 dark:bg-white/5 rounded-3xl border border-white/50 dark:border-white/5 overflow-hidden relative group cursor-pointer">
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4">
                                                <p className="text-white text-[10px] font-black uppercase tracking-widest">Doodles #12{id}</p>
                                            </div>
                                            <div className="w-full h-full bg-gradient-to-br from-indigo-100/20 to-purple-100/20 flex items-center justify-center text-slate-300 dark:text-slate-600">
                                                <Icon name="Image" size={32} />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const App = () => {
            useEffect(() => {
                try {
                    const theme = localStorage.getItem('theme');
                    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        document.documentElement.classList.add('dark');
                    }
                } catch (e) {}
            }, []);
        return (
                <div className="flex w-full h-full transition-colors duration-500">
                    <Sidebar activePage="crypto" />
                    <CryptoPage />
                </div>
            );
        };

        try { const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); } catch (e) { console.error(e); }
    </script>
</body>
</html>
