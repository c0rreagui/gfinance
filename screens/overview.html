<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Finance - Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/shared.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="../assets/shared.js"></script>
<script>tailwind.config = { darkMode: 'class' }</script></head>
<body class="bg-brand-bg text-brand-fg overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Components
        const SidebarItem = ({ icon, label, active, onClick }) => (
            <div 
                onClick={onClick}
                className={`flex items-center gap-3 px-4 py-3 rounded-button cursor-pointer transition-all duration-200 ${
                    active 
                    ? 'bg-brand-accent text-white shadow-lg shadow-brand-accent/20' 
                    : 'text-brand-muted hover:bg-brand-border/50 hover:text-brand-fg'
                }`}
            >
                <span className="text-xl">{icon}</span>
                <span className="font-medium">{label}</span>
            </div>
        );

        const SummaryCard = ({ title, value, type, trend }) => (
            <div className="bg-brand-surface p-6 rounded-card border border-brand-border card-wow animate-in">
                <div className="flex justify-between items-start mb-4">
                    <span className="text-brand-muted font-medium uppercase text-xs tracking-wider">{title}</span>
                    <span className={`px-2 py-1 rounded-full text-[10px] font-bold ${
                        trend > 0 ? 'bg-brand-success/10 text-brand-success' : 'bg-brand-danger/10 text-brand-danger'
                    }`}>
                        {trend > 0 ? '↑' : '↓'} {Math.abs(trend)}%
                    </span>
                </div>
                <div className="text-3xl font-bold tracking-tight">
                    {new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value)}
                </div>
                <div className="mt-4 h-1 w-full bg-brand-border rounded-full overflow-hidden">
                    <div 
                        className={`h-full rounded-full ${type === 'income' ? 'bg-brand-success' : type === 'expense' ? 'bg-brand-danger' : 'bg-brand-accent'}`}
                        style={{ width: '70%' }}
                    ></div>
                </div>
            </div>
        );

        const AreaChart = () => {
            const data = window.mockHistory;
            const max = Math.max(...data.map(d => Math.max(d.income, d.expense)));
            const points = data.map((d, i) => ({
                x: (i / (data.length - 1)) * 100,
                y: 100 - (d.income / max) * 80
            }));
            
            const pathData = `M ${points[0].x},${points[0].y} ` + 
                points.slice(1).map(p => `L ${p.x},${p.y}`).join(' ') +
                ` L 100,100 L 0,100 Z`;

            const curveData = `M ${points[0].x},${points[0].y} ` + 
                points.slice(1).map((p, i) => {
                    const prev = points[i];
                    const cp1x = prev.x + (p.x - prev.x) / 2;
                    return `C ${cp1x},${prev.y} ${cp1x},${p.y} ${p.x},${p.y}`;
                }).join(' ');

            return (
                <div className="bg-brand-surface p-6 rounded-card border border-brand-border h-[400px] flex flex-col animate-in" style={{animationDelay: '0.1s'}}>
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-lg font-bold">Fluxo de Caixa</h3>
                        <div className="flex gap-4 text-xs font-medium">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 rounded-full bg-brand-accent"></div>
                                <span>Receitas</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 rounded-full bg-brand-border"></div>
                                <span>Despesas</span>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 relative mt-4">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full">
                            <defs>
                                <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style={{stopColor: 'var(--accent)', stopOpacity: 0.2}} />
                                    <stop offset="100%" style={{stopColor: 'var(--accent)', stopOpacity: 0}} />
                                </linearGradient>
                            </defs>
                            {/* Grid lines */}
                            {[0, 25, 50, 75, 100].map(v => (
                                <line key={v} x1="0" y1={v} x2="100" y2={v} stroke="var(--border)" strokeWidth="0.1" />
                            ))}
                            {/* Area */}
                            <path d={`${curveData} L 100,100 L 0,100 Z`} fill="url(#grad)" className="transition-all duration-1000" />
                            {/* Line */}
                            <path d={curveData} fill="none" stroke="var(--accent)" strokeWidth="1.5" strokeLinecap="round" />
                            {/* Points */}
                            {points.map((p, i) => (
                                <circle key={i} cx={p.x} cy={p.y} r="1.5" fill="var(--surface)" stroke="var(--accent)" strokeWidth="1" />
                            ))}
                        </svg>
                        <div className="flex justify-between mt-4 text-[10px] text-brand-muted font-bold uppercase tracking-widest">
                            {data.map(d => <span key={d.month}>{d.month}</span>)}
                        </div>
                    </div>
                </div>
            );
        };

        const TransactionTable = () => (
            <div className="bg-brand-surface rounded-card border border-brand-border overflow-hidden animate-in" style={{animationDelay: '0.2s'}}>
                <div className="p-6 border-b border-brand-border flex justify-between items-center">
                    <h3 className="text-lg font-bold">Transações Recentes</h3>
                    <button className="text-brand-accent text-sm font-bold hover:underline">Ver todas</button>
                </div>
                <div className="overflow-x-auto">
                    <table className="w-full text-left">
                        <thead>
                            <tr className="text-[10px] font-bold text-brand-muted uppercase tracking-widest border-b border-brand-border">
                                <th className="px-6 py-4">Data</th>
                                <th className="px-6 py-4">Descrição</th>
                                <th className="px-6 py-4">Categoria</th>
                                <th className="px-6 py-4 text-right">Valor</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-brand-border">
                            {window.mockTransactions.slice(0, 5).map(t => (
                                <tr key={t.id} className="hover:bg-brand-bg/50 transition-colors group">
                                    <td className="px-6 py-4 text-sm text-brand-muted">
                                        {new Date(t.date).toLocaleDateString('pt-BR')}
                                    </td>
                                    <td className="px-6 py-4 text-sm font-medium">{t.description}</td>
                                    <td className="px-6 py-4">
                                        <span className="px-2 py-1 bg-brand-border/50 rounded-full text-[10px] font-bold text-brand-muted">
                                            {t.category}
                                        </span>
                                    </td>
                                    <td className={`px-6 py-4 text-sm font-bold text-right ${t.type === 'income' ? 'text-brand-success' : 'text-brand-danger'}`}>
                                        {t.type === 'income' ? '+' : ''}
                                        {new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(t.value)}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const App = () => {
            useEffect(() => {
                try {
                    const theme = localStorage.getItem('theme');
                    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        document.documentElement.classList.add('dark');
                    }
                } catch (e) {}
            }, []);
        return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className={`glass fixed md:static inset-y-0 left-0 z-50 w-64 transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 ease-in-out p-6 flex flex-col gap-8 border-r border-brand-border`}>
                        <div className="flex items-center gap-3 px-2">
                            <div className="w-10 h-10 bg-brand-accent rounded-xl flex items-center justify-center text-white shadow-lg shadow-brand-accent/30">
                                <span className="text-2xl font-black">G</span>
                            </div>
                            <span className="text-xl font-bold tracking-tight">G-Finance</span>
                        </div>

                        <nav className="flex-1 flex flex-col gap-2">
                            <SidebarItem icon="󰄬" label="Visão Geral" active={activeTab === 'Overview'} onClick={() => setActiveTab('Overview')} />
                            <SidebarItem icon="󰄬" label="Transações" active={activeTab === 'Transactions'} onClick={() => location.href='transactions.html'} />
                            <SidebarItem icon="󰄬" label="Integrações" active={activeTab === 'Integrations'} onClick={() => location.href='integrations.html'} />
                            <SidebarItem icon="󰄬" label="Configurações" active={activeTab === 'Settings'} onClick={() => location.href='settings.html'} />
                        </nav>

                        <div className="mt-auto p-4 bg-brand-accent/5 rounded-card border border-brand-accent/20">
                            <div className="text-xs font-bold text-brand-accent uppercase tracking-widest mb-2">Upgrade Pro</div>
                            <p className="text-[11px] text-brand-muted leading-relaxed mb-3">Tenha acesso a gráficos avançados e relatórios mensais.</p>
                            <button className="w-full py-2 bg-brand-accent text-white text-xs font-bold rounded-button hover:opacity-90 transition-opacity">
                                Ver Planos
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col min-w-0">
                        {/* Header */}
                        <header className="h-20 border-b border-brand-border bg-brand-surface/80 backdrop-blur-md sticky top-0 z-40 px-8 flex items-center justify-between">
                            <div className="flex flex-col">
                                <h2 className="text-xl font-bold tracking-tight">Olá, Guilherme</h2>
                                <span className="text-xs text-brand-muted font-medium">Seja bem-vindo de volta ao seu controle financeiro.</span>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-brand-bg border border-brand-border rounded-full text-xs font-bold">
                                    <span className="w-2 h-2 rounded-full bg-brand-success animate-pulse"></span>
                                    <span>Itaú Conectado</span>
                                </div>
                                <div className="w-10 h-10 rounded-full bg-brand-border border-2 border-brand-surface overflow-hidden cursor-pointer hover:border-brand-accent transition-colors">
                                    <img src="https://ui-avatars.com/api/?name=Guilherme&background=random" alt="User" />
                                </div>
                            </div>
                        </header>

                        {/* Dashboard Scrollable Area */}
                        <div className="p-8 flex flex-col gap-8">
                            {/* Summary Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <SummaryCard title="Saldo Atual" value={18450.50} type="balance" trend={+4.5} />
                                <SummaryCard title="Receitas (Maio)" value={13200.00} type="income" trend={+12.3} />
                                <SummaryCard title="Despesas (Maio)" value={8800.00} type="expense" trend={-2.1} />
                            </div>

                            {/* Charts & Data */}
                            <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                                <div className="xl:col-span-2">
                                    <AreaChart />
                                </div>
                                <div className="flex flex-col gap-6">
                                    <div className="bg-brand-surface p-6 rounded-card border border-brand-border animate-in" style={{animationDelay: '0.15s'}}>
                                        <h3 className="text-lg font-bold mb-4">Metas de Gastos</h3>
                                        <div className="space-y-4">
                                            {[
                                                { label: 'Alimentação', current: 1200, target: 1500, color: 'brand-accent' },
                                                { label: 'Lazer', current: 800, target: 1000, color: 'brand-success' },
                                                { label: 'Transporte', current: 450, target: 400, color: 'brand-danger' },
                                            ].map(meta => (
                                                <div key={meta.label}>
                                                    <div className="flex justify-between text-xs mb-1">
                                                        <span className="font-bold">{meta.label}</span>
                                                        <span className="text-brand-muted">{meta.current} / {meta.target}</span>
                                                    </div>
                                                    <div className="h-1.5 w-full bg-brand-border rounded-full overflow-hidden">
                                                        <div 
                                                            className={`h-full rounded-full bg-${meta.color}`}
                                                            style={{ width: `${Math.min(100, (meta.current / meta.target) * 100)}%` }}
                                                        ></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-brand-accent p-6 rounded-card text-white shadow-xl shadow-brand-accent/20 animate-in" style={{animationDelay: '0.2s'}}>
                                        <div className="text-3xl mb-4">💡</div>
                                        <h4 className="font-bold mb-2">Dica de hoje</h4>
                                        <p className="text-xs opacity-90 leading-relaxed">Você economizou 15% a mais em lazer este mês. Que tal investir essa diferença em ativos de renda fixa?</p>
                                    </div>
                                </div>
                            </div>

                            {/* Table */}
                            <TransactionTable />
                        </div>
                    </main>
                </div>
            );
        };

        try { const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); } catch (e) { console.error(e); }
    </script>
</body>
</html>
